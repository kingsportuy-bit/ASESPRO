server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.html$ {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location ~* \.(?:css|js|png|jpe?g|webp|svg|woff2?|mp4)$ {
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }
}
