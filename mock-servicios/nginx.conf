server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # Traefik terminates HTTPS. Relative redirects preserve the public scheme.
    absolute_redirect off;

    location = /index.html {
        return 301 /$is_args$args;
    }

    location ~ ^/(servicios|nosotros|contacto)\.html$ {
        return 301 /$1$is_args$args;
    }

    location ~ ^/(servicios|nosotros|contacto)/$ {
        return 301 /$1$is_args$args;
    }

    location ~ ^/cobertura(?:\.html|/)?$ {
        return 301 "/$is_args$args#cobertura";
    }

    location ~ ^/(servicios|nosotros|contacto)$ {
        default_type text/html;
        add_header Cache-Control "no-cache" always;
        try_files $uri.html =404;
    }

    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }

    location ~* \.html$ {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location ~* \.(?:css|js|png|jpe?g|webp|svg|woff2?|mp4)$ {
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }
}
