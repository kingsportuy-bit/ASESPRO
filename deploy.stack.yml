version: "3.9"

services:
  asespro-web:
    image: asespro-web:latest
    environment:
      NEXT_PUBLIC_SITE_URL: https://inmobiliaria.asespro.kodebix.com
      PROPERTY_DATA_SOURCE: mock
    networks:
      - codexanet
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: "0.75"
          memory: 768M
        reservations:
          cpus: "0.20"
          memory: 192M
      labels:
        - traefik.enable=true
        - traefik.docker.network=codexanet
        - traefik.http.routers.asespro-web.rule=Host(`inmobiliaria.asespro.kodebix.com`) || Host(`asespro.codexa.uy`)
        - traefik.http.routers.asespro-web.entrypoints=websecure
        - traefik.http.routers.asespro-web.tls=true
        - traefik.http.routers.asespro-web.tls.certresolver=letsencryptresolver
        - traefik.http.services.asespro-web.loadbalancer.server.port=3000
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

  asespro-panel:
    image: asespro-web:latest
    env_file:
      - /opt/asespro/.env
    networks:
      - codexanet
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: "0.75"
          memory: 768M
        reservations:
          cpus: "0.20"
          memory: 192M
      labels:
        - traefik.enable=true
        - traefik.docker.network=codexanet
        - traefik.http.routers.asespro-panel.rule=Host(`panel.inmobiliaria.asespro.kodebix.com`) || Host(`panelasespro.codexa.uy`)
        - traefik.http.routers.asespro-panel.entrypoints=websecure
        - traefik.http.routers.asespro-panel.tls=true
        - traefik.http.routers.asespro-panel.tls.certresolver=letsencryptresolver
        - traefik.http.services.asespro-panel.loadbalancer.server.port=3000
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/admin"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

  asespro-servicios:
    image: asespro-servicios:latest
    networks:
      - codexanet
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
        reservations:
          cpus: "0.05"
          memory: 32M
      labels:
        - traefik.enable=true
        - traefik.docker.network=codexanet
        - traefik.http.routers.asespro-servicios.rule=Host(`asespro.kodebix.com`)
        - traefik.http.routers.asespro-servicios.entrypoints=websecure
        - traefik.http.routers.asespro-servicios.tls=true
        - traefik.http.routers.asespro-servicios.tls.certresolver=letsencryptresolver
        - traefik.http.services.asespro-servicios.loadbalancer.server.port=80
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  codexanet:
    external: true
